<body>

  <nav id="sidebar">
    <div class="sidebar-brand" id="sidebarBrand"></div>
    <ul id="navLinks"></ul>
    <div class="sidebar-footer" id="sidebarFooter"></div>
  </nav>

  <header id="topbar">
    <button class="topbar-toggle" id="menuToggle" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
    <div class="topbar-brand" id="topbarBrand"></div>
  </header>

  <div class="overlay" id="overlay"></div>

  <main id="app"></main>

  <!-- Ask-my-AI — top-right so it stays visible without covering content CTAs -->
  <button class="bot-fab" id="botFab" type="button" aria-expanded="false" aria-controls="botPanel" aria-label="Ask my AI">
    <span class="bot-fab-orb" aria-hidden="true">
      <span class="bot-fab-ring"></span>
      <span class="bot-fab-pulse"></span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg>
    </span>
    <span class="bot-fab-label">Ask my AI</span>
  </button>
  <div class="bot-panel" id="botPanel" role="dialog" aria-label="Ask my AI">
    <div class="bot-panel-header">
      <h3>
        Ask my AI
        <span class="bot-badge">Live</span>
      </h3>
      <button class="bot-panel-close" id="botClose" type="button" aria-label="Close">&times;</button>
    </div>
    <div class="bot-panel-body">
      <p class="bot-intro">Ask about my work, or attach a JD (PDF, Word, Markdown…) to check fit.</p>
      <div class="bot-samples" id="botSamples">
        <p class="bot-samples-label">Quick asks</p>
        <button type="button" class="bot-sample-q">What GenAI / MLOps work have you shipped in production?</button>
        <button type="button" class="bot-sample-q">Are you open to roles, and what are you strongest in?</button>
        <button type="button" class="bot-sample-q">Walk me through a production system you’d own on day one.</button>
      </div>
      <div class="bot-messages" id="botMessages" aria-live="polite"></div>
      <p class="bot-status" id="botStatus" hidden></p>
      <form class="bot-composer" id="botForm">
        <div class="bot-attach-chip" id="botAttachChip" hidden>
          <span id="botAttachName"></span>
          <button type="button" class="bot-attach-clear" id="botAttachClear" aria-label="Remove file">&times;</button>
        </div>
        <textarea
          class="bot-input"
          id="botInput"
          rows="2"
          maxlength="12000"
          autocomplete="off"
          placeholder="Ask a question, or paste a job description…"
          aria-label="Ask a question or paste a job description"
        ></textarea>
        <div class="bot-composer-bar">
          <label class="bot-attach" title="Upload JD (PDF, Word, MD, TXT…)">
            <input
              type="file"
              id="botJdFile"
              accept=".pdf,.docx,.doc,.md,.markdown,.txt,.text,.rtf,.html,.htm,.csv,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,text/plain,text/markdown,text/html,text/rtf"
              hidden
            />
            <svg class="bot-attach-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
            Attach JD
          </label>
          <div class="bot-composer-actions">
            <button class="bot-match" id="botJdMatch" type="button">Match JD</button>
            <button class="bot-send" id="botSend" type="submit">Ask</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <script src="src/data.js"></script>

  <script src="src/pages/custom.js"></script>
  <script src="src/components/bot.js"></script>
  <script src="src/router.js"></script>

  <script data-goatcounter="https://girdharik.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>
</body>
</html>
