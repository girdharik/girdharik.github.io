  <!-- Ask-my-AI — top-right so it stays visible without covering content CTAs -->
  <div class="bot-greeting" id="botGreeting" aria-live="polite">
    <p class="bot-greeting-hi">
      Hi
      <span class="bot-greeting-wave" aria-hidden="true">
        <svg viewBox="0 0 36 36" width="22" height="22" fill="currentColor">
          <path d="M7.5 18.2c-.4-1.2.3-2.4 1.5-2.7.4-.1.8 0 1.1.2V11c0-1.1.9-2 2-2s2 .9 2 2v2.4c.3-.5.8-.9 1.5-1 .9-.2 1.8.4 2 1.3V9.5c0-1.1.9-2 2-2s2 .9 2 2v5.2c.3-.4.8-.7 1.4-.8.9-.2 1.8.4 2 1.3v-.7c0-1.1.9-2 2-2s2 .9 2 2v8.8c0 4.2-2.7 7.7-6.5 8.9-2.6.8-5.2.4-7.3-1.1-2.4-1.7-4.2-4.4-4.9-7.5l-.8-3.4z"/>
        </svg>
      </span>
    </p>
    <p class="bot-greeting-text">I can share more insights about my work — projects, how I build, and fit for a role.</p>
    <div class="bot-greeting-actions">
      <button type="button" class="bot-greeting-cta" id="botGreetingOpen">Ask me</button>
      <button type="button" class="bot-greeting-dismiss" id="botGreetingDismiss" aria-label="Dismiss">Not now</button>
    </div>
  </div>
  <button class="bot-fab" id="botFab" type="button" aria-expanded="false" aria-controls="botPanel" aria-label="Ask my AI">
    <span class="bot-fab-orb" aria-hidden="true">
      <span class="bot-fab-ring"></span>
      <span class="bot-fab-pulse"></span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg>
    </span>
    <span class="bot-fab-label">Ask my AI</span>
    <span class="bot-fab-hi" aria-hidden="true">
      Hi
      <svg viewBox="0 0 36 36" width="20" height="20" fill="currentColor">
        <path d="M7.5 18.2c-.4-1.2.3-2.4 1.5-2.7.4-.1.8 0 1.1.2V11c0-1.1.9-2 2-2s2 .9 2 2v2.4c.3-.5.8-.9 1.5-1 .9-.2 1.8.4 2 1.3V9.5c0-1.1.9-2 2-2s2 .9 2 2v5.2c.3-.4.8-.7 1.4-.8.9-.2 1.8.4 2 1.3v-.7c0-1.1.9-2 2-2s2 .9 2 2v8.8c0 4.2-2.7 7.7-6.5 8.9-2.6.8-5.2.4-7.3-1.1-2.4-1.7-4.2-4.4-4.9-7.5l-.8-3.4z"/>
      </svg>
    </span>
  </button>
  <div class="bot-panel" id="botPanel" role="dialog" aria-label="Ask my AI">
    <div class="bot-panel-header">
      <h3>
        Ask my AI
        <span class="bot-badge">Live</span>
      </h3>
      <button class="bot-panel-close" id="botClose" type="button" aria-label="Close">&times;</button>
    </div>
    <button type="button" class="bot-panel-resize" id="botPanelResize" aria-label="Resize chat" title="Drag to resize"></button>
    <div class="bot-panel-body">
      <p class="bot-intro">Ask about my background, projects, or how I work.</p>
      <div class="bot-samples" id="botSamples">
        <p class="bot-samples-label">Suggestions</p>
        <button type="button" class="bot-sample-q" data-action="ask">What kind of work do you do?</button>
        <button type="button" class="bot-sample-q" data-action="ask">What have you built recently?</button>
        <button type="button" class="bot-sample-q" data-action="compare">Looking for a good fit for an open role?</button>
      </div>
      <div class="bot-messages" id="botMessages" aria-live="polite"></div>
      <p class="bot-status" id="botStatus" hidden></p>
      <form class="bot-composer" id="botForm">
        <textarea
          class="bot-input"
          id="botInput"
          rows="2"
          maxlength="500"
          autocomplete="off"
          placeholder="Ask a question…"
          aria-label="Ask a question"
        ></textarea>
        <div class="bot-composer-bar">
          <span class="bot-composer-hint">Press Enter to send</span>
          <button class="bot-send" id="botSend" type="submit" aria-label="Send" title="Send">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M22 2L11 13"/>
              <path d="M22 2L15 22l-4-9-9-4 20-7z"/>
            </svg>
          </button>
        </div>
      </form>
      <input
        type="file"
        id="botJdFile"
        accept=".pdf,.docx,.doc,.md,.markdown,.txt,.text,.rtf,.html,.htm,.csv,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,text/plain,text/markdown,text/html,text/rtf"
        hidden
      />
    </div>
  </div>
