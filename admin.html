<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Portfolio Editor</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <style>
    :root {
      --bg: #0f172a; --surface: #1e293b; --border: #334155;
      --text: #e2e8f0; --muted: #94a3b8; --primary: #3b82f6;
      --accent: #06b6d4; --danger: #ef4444; --success: #22c55e;
      --radius: 10px; --font: 'Inter', sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; }

    /* ── Layout ───────────────────────────────── */
    .admin-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 1rem 2rem; background: var(--surface); border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 100;
    }
    .admin-header h1 { font-size: 1.1rem; font-weight: 700; display: flex; align-items: center; gap: 0.5rem; }
    .admin-header h1 span { color: var(--primary); }
    .header-actions { display: flex; gap: 0.5rem; align-items: center; }

    .admin-body { display: flex; min-height: calc(100vh - 56px); }
    .admin-sidebar {
      width: 220px; background: var(--surface); border-right: 1px solid var(--border);
      padding: 1rem 0; position: sticky; top: 56px; height: calc(100vh - 56px); overflow-y: auto;
    }
    .admin-sidebar button {
      display: flex; align-items: center; gap: 0.5rem; width: 100%;
      padding: 0.65rem 1.25rem; border: none; background: none; color: var(--muted);
      font-family: var(--font); font-size: 0.85rem; font-weight: 500; cursor: pointer;
      text-align: left; transition: all 0.15s;
    }
    .admin-sidebar button:hover { background: rgba(59,130,246,0.08); color: var(--text); }
    .admin-sidebar button.active { background: rgba(59,130,246,0.15); color: var(--primary); border-right: 2px solid var(--primary); }

    .admin-content { flex: 1; padding: 2rem; max-width: 1100px; width: 100%; }
    .admin-content.wide { max-width: none; }

    /* ── Components ────────────────────────────── */
    .section-title { font-size: 1.3rem; font-weight: 700; margin-bottom: 1.5rem; }
    .field { margin-bottom: 1.25rem; }
    .field label {
      display: block; font-size: 0.78rem; font-weight: 600;
      color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em;
      margin-bottom: 0.35rem;
    }
    .field input, .field textarea, .field select {
      width: 100%; padding: 0.6rem 0.85rem; background: var(--bg);
      border: 1px solid var(--border); border-radius: var(--radius);
      color: var(--text); font-family: var(--font); font-size: 0.88rem;
      outline: none; transition: border-color 0.2s;
    }
    .field input:focus, .field textarea:focus { border-color: var(--primary); }
    .field textarea { min-height: 100px; resize: vertical; line-height: 1.6; }
    .field .hint { font-size: 0.75rem; color: var(--muted); margin-top: 0.25rem; }

    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 1.25rem; margin-bottom: 1rem;
      position: relative;
    }
    .card-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 1rem; padding-bottom: 0.75rem; border-bottom: 1px solid var(--border);
    }
    .card-header h3 { font-size: 0.95rem; font-weight: 600; }
    .card-actions { display: flex; gap: 0.35rem; }

    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem; }

    /* ── Buttons ───────────────────────────────── */
    .btn {
      display: inline-flex; align-items: center; gap: 0.4rem;
      padding: 0.5rem 1rem; border: 1px solid var(--border); border-radius: var(--radius);
      background: var(--surface); color: var(--text); font-family: var(--font);
      font-size: 0.82rem; font-weight: 500; cursor: pointer; transition: all 0.15s;
    }
    .btn:hover { border-color: var(--primary); color: var(--primary); }
    .btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; }
    .btn-primary:hover { background: #2563eb; }
    .btn-danger { color: var(--danger); }
    .btn-danger:hover { background: rgba(239,68,68,0.1); border-color: var(--danger); }
    .btn-sm { padding: 0.3rem 0.6rem; font-size: 0.78rem; }
    .btn-success { background: var(--success); border-color: var(--success); color: #fff; }
    .btn-success:hover { background: #16a34a; }

    /* ── Setup / Status ───────────────────────── */
    .setup-box {
      max-width: 500px; margin: 4rem auto; padding: 2rem;
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      text-align: center;
    }
    .setup-box h2 { font-size: 1.2rem; margin-bottom: 0.5rem; }
    .setup-box p { font-size: 0.85rem; color: var(--muted); margin-bottom: 1.5rem; line-height: 1.6; }
    .setup-box input { margin-bottom: 0.5rem; }
    .setup-box .btn { width: 100%; justify-content: center; margin-top: 0.5rem; }

    .toast {
      position: fixed; bottom: 1.5rem; right: 1.5rem; padding: 0.75rem 1.25rem;
      border-radius: var(--radius); font-size: 0.85rem; font-weight: 500; z-index: 200;
      transform: translateY(100px); opacity: 0; transition: all 0.3s;
    }
    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.success { background: var(--success); color: #fff; }
    .toast.error { background: var(--danger); color: #fff; }

    .status-bar {
      display: flex; align-items: center; gap: 0.5rem;
      font-size: 0.78rem; color: var(--muted);
    }
    .status-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--success); display: inline-block;
    }
    .status-dot.disconnected { background: var(--danger); }

    /* ── List editor ──────────────────────────── */
    .list-editor { display: flex; flex-direction: column; gap: 0.5rem; }
    .list-item {
      display: flex; gap: 0.5rem; align-items: center;
    }
    .list-item input { flex: 1; }

    /* ── Loading ───────────────────────────────── */
    .spinner {
      width: 20px; height: 20px; border: 2px solid var(--border);
      border-top-color: var(--primary); border-radius: 50%;
      animation: spin 0.6s linear infinite; display: inline-block;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Documents workspace ───────────────────── */
    .docs-admin {
      display: grid;
      grid-template-columns: 220px 240px 1fr;
      gap: 1rem;
      min-height: calc(100vh - 120px);
    }
    .docs-pane {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 0.85rem; overflow: auto;
      max-height: calc(100vh - 120px);
    }
    .docs-pane h4 {
      font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--muted); margin-bottom: 0.65rem;
    }
    .docs-pane-actions { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-bottom: 0.75rem; }
    .folder-item, .doc-item {
      display: flex; align-items: center; justify-content: space-between; gap: 0.35rem;
      width: 100%; padding: 0.55rem 0.6rem; border: 1px solid transparent;
      border-radius: 8px; background: none; color: var(--text);
      font-family: var(--font); font-size: 0.84rem; cursor: pointer; text-align: left;
    }
    .folder-item:hover, .doc-item:hover { background: rgba(59,130,246,0.08); }
    .folder-item.active, .doc-item.active {
      background: rgba(59,130,246,0.15); border-color: rgba(59,130,246,0.35); color: var(--primary);
    }
    .doc-editor-wrap { display: flex; flex-direction: column; gap: 0.75rem; height: 100%; }
    .doc-editor-toolbar { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: end; }
    .doc-split {
      display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; flex: 1; min-height: 420px;
    }
    .doc-split textarea {
      width: 100%; height: 100%; min-height: 420px; resize: vertical;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.82rem; line-height: 1.55;
    }
    .doc-live-preview {
      background: #0b1220; border: 1px solid var(--border); border-radius: var(--radius);
      padding: 1rem; overflow: auto; min-height: 420px; line-height: 1.65; font-size: 0.9rem;
    }
    .doc-live-preview h1,.doc-live-preview h2,.doc-live-preview h3 { margin: 1rem 0 0.5rem; }
    .doc-live-preview p, .doc-live-preview ul, .doc-live-preview ol { margin: 0.5rem 0; }
    .doc-live-preview code { background: rgba(59,130,246,0.15); padding: 0.1rem 0.3rem; border-radius: 4px; }
    .doc-live-preview pre { background: #020617; padding: 0.75rem; overflow: auto; border-radius: 8px; }
    .doc-live-preview table { width: 100%; border-collapse: collapse; }
    .doc-live-preview th, .doc-live-preview td { border: 1px solid var(--border); padding: 0.4rem 0.5rem; }
    .empty-hint { color: var(--muted); font-size: 0.85rem; padding: 1rem 0.25rem; line-height: 1.5; }
    .import-hidden { display: none; }

    /* ── Responsive ────────────────────────────── */
    @media (max-width: 1100px) {
      .docs-admin { grid-template-columns: 1fr 1fr; }
      .docs-pane.editor-pane { grid-column: 1 / -1; }
      .doc-split { grid-template-columns: 1fr; }
    }
    @media (max-width: 768px) {
      .admin-sidebar { display: none; }
      .admin-content { padding: 1rem; }
      .row, .row-3 { grid-template-columns: 1fr; }
      .docs-admin { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div id="app"></div>
<div id="toast" class="toast"></div>

<script>
/* ================================================================
   Admin Panel — GitHub API-based CMS for portfolio
   Works on free GitHub Pages (static, no server needed)
   ================================================================ */

const APP = {
  token: localStorage.getItem('gh_token') || '',
  repo: localStorage.getItem('gh_repo') || '',   // "username/repo-name"
  branch: localStorage.getItem('gh_branch') || 'main',
  filePath: 'src/data.js',
  data: null,      // parsed SITE object
  fileSha: '',     // needed for GitHub API commits
  activeTab: 'documents',
  docsFolderId: '',   // '' = all
  docsSelectedId: '',
};

/* ── GitHub API helpers ─────────────────────────── */
const GH = {
  headers() {
    return {
      'Authorization': `token ${APP.token}`,
      'Accept': 'application/vnd.github.v3+json',
    };
  },

  utf8FromBase64(b64) {
    const bin = atob(String(b64 || '').replace(/\n/g, ''));
    const bytes = Uint8Array.from(bin, (c) => c.charCodeAt(0));
    return new TextDecoder('utf-8').decode(bytes);
  },

  utf8ToBase64(text) {
    const bytes = new TextEncoder().encode(text);
    let bin = '';
    bytes.forEach((b) => { bin += String.fromCharCode(b); });
    return btoa(bin);
  },

  async getFile() {
    const url = `https://api.github.com/repos/${APP.repo}/contents/${APP.filePath}?ref=${APP.branch}`;
    const res = await fetch(url, { headers: GH.headers() });
    if (!res.ok) throw new Error(`Failed to fetch file: ${res.status}`);
    const json = await res.json();
    APP.fileSha = json.sha;
    return GH.utf8FromBase64(json.content);
  },

  async saveFile(content, message) {
    const url = `https://api.github.com/repos/${APP.repo}/contents/${APP.filePath}`;
    const body = {
      message: message || `Update portfolio content — ${new Date().toLocaleDateString()}`,
      content: GH.utf8ToBase64(content),
      sha: APP.fileSha,
      branch: APP.branch,
    };
    const res = await fetch(url, { method: 'PUT', headers: GH.headers(), body: JSON.stringify(body) });
    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.message || `Save failed: ${res.status}`);
    }
    const json = await res.json();
    APP.fileSha = json.content.sha;
    return json;
  },

  async testConnection() {
    const url = `https://api.github.com/repos/${APP.repo}`;
    const res = await fetch(url, { headers: GH.headers() });
    return res.ok;
  },
};

/* ── Parse data.js text → SITE object ───────────── */
function parseDataJS(text) {
  // Extract the object literal between "const SITE = {" and the final "};"
  const start = text.indexOf('{');
  const end = text.lastIndexOf('}');
  if (start === -1 || end === -1) throw new Error('Could not parse data.js');
  const objStr = text.substring(start, end + 1);

  // Handle function expressions in chart data by replacing them with null
  // (they'll be preserved in the raw text for charts)
  const sanitized = objStr.replace(/function\s*\([^)]*\)\s*\{[^}]*\}/g, 'null');
  try {
    return (new Function('return (' + sanitized + ')'))();
  } catch (e) {
    throw new Error('Failed to parse SITE object: ' + e.message);
  }
}

/* ── Serialize SITE object → data.js text ───────── */
function serializeDataJS(siteObj, originalText) {
  // We rebuild the meta, home, experience, projects (non-detail), skills, and about sections
  // For project detail sections (charts, tables), we preserve the original text
  const header = `/**
 * ============================================================
 *  SITE DATA — Single source of truth
 * ============================================================
 *  Edit ONLY this file to update content.
 *
 *  PAGES  – defined by the \`pages\` array; router picks them up
 *           automatically. Add a page → nav link + route appear.
 *
 *  PROJECTS – each item in \`projects\` gets a card on /projects
 *           AND its own deep-dive page at /projects/<slug>.
 *           Add a \`detail\` object with sections array to build
 *           an interactive project showcase page.
 *
 *  Section types available inside project detail:
 *    "text"        – paragraphs / rich description
 *    "metrics"     – counter cards
 *    "architecture"– diagram image + caption
 *    "features"    – bullet feature list with icons
 *    "tech"        – tech stack badges
 *    "gallery"     – image carousel / grid
 *    "code"        – code snippet block
 *    "timeline"    – step-by-step process
 *    "chart"       – Chart.js graph (bar, line, doughnut, radar)
 *    "table"       – interactive sortable/filterable data table
 * ============================================================
 */

`;
  const body = JSON.stringify(siteObj, (key, val) => {
    // Keep functions as-is (they'll be null in JSON, handled below)
    return val;
  }, 2);

  // Fix JSON to valid JS: unquote keys, restore trailing commas
  let js = body
    .replace(/"([a-zA-Z_$][a-zA-Z0-9_$]*)"\s*:/g, '$1: ')  // unquote keys
    .replace(/: "true"/g, ': true')
    .replace(/: "false"/g, ': false');

  return header + 'const SITE = ' + js + ';\n';
}

/* ── Toast notification ─────────────────────────── */
function toast(msg, type = 'success') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = `toast ${type} show`;
  setTimeout(() => el.classList.remove('show'), 3000);
}

/* ── Render setup screen ────────────────────────── */
function renderSetup() {
  document.getElementById('app').innerHTML = `
    <div class="setup-box">
      <h2>⚙️ Connect to GitHub</h2>
      <p>
        Enter your GitHub repo and a Personal Access Token (PAT) with <strong>repo</strong> scope.<br>
        <a href="https://github.com/settings/tokens/new?scopes=repo&description=Portfolio+Admin" target="_blank" style="color:var(--primary)">
          Create a token here →
        </a><br><br>
        Your token is stored <strong>only in this browser's localStorage</strong>.<br>
        It is never sent anywhere except GitHub's API.
      </p>
      <div class="field">
        <label>Repository (owner/repo)</label>
        <input type="text" id="setupRepo" placeholder="girdharik/girdharik.github.io" value="${APP.repo}">
        <div class="hint">e.g. girdharik/girdharik.github.io</div>
      </div>
      <div class="field">
        <label>Branch</label>
        <input type="text" id="setupBranch" placeholder="main" value="${APP.branch}">
      </div>
      <div class="field">
        <label>Personal Access Token</label>
        <input type="password" id="setupToken" placeholder="ghp_..." value="${APP.token}">
      </div>
      <button class="btn btn-primary" onclick="doSetup()">Connect & Load Content</button>
    </div>`;
}

async function doSetup() {
  const repo = document.getElementById('setupRepo').value.trim();
  const branch = document.getElementById('setupBranch').value.trim() || 'main';
  const token = document.getElementById('setupToken').value.trim();

  if (!repo || !token) return toast('Please fill in all fields', 'error');

  APP.repo = repo; APP.branch = branch; APP.token = token;
  localStorage.setItem('gh_repo', repo);
  localStorage.setItem('gh_branch', branch);
  localStorage.setItem('gh_token', token);

  try {
    const ok = await GH.testConnection();
    if (!ok) throw new Error('Cannot access repo');
    await loadContent();
    toast('Connected successfully!');
  } catch (e) {
    toast('Connection failed: ' + e.message, 'error');
  }
}

/* ── Load content from GitHub ───────────────────── */
function ensureDocsModel() {
  if (!APP.data.docs) APP.data.docs = { folders: [], items: [] };
  if (!Array.isArray(APP.data.docs.folders)) APP.data.docs.folders = [];
  if (!Array.isArray(APP.data.docs.items)) APP.data.docs.items = [];
  // Keep Documents in nav if missing
  if (!APP.data.pages) APP.data.pages = [];
  if (!APP.data.pages.some((p) => p.id === 'documents')) {
    APP.data.pages.push({ id: 'documents', label: 'Documents', icon: 'fileText' });
  }
}

async function loadContent() {
  const raw = await GH.getFile();
  APP.data = parseDataJS(raw);
  ensureDocsModel();
  APP.rawText = raw;
  renderAdmin();
}

/* ── Save content to GitHub ─────────────────────── */
async function saveContent() {
  const btn = document.querySelector('.save-btn');
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Saving...'; }
  try {
    const js = serializeDataJS(APP.data, APP.rawText);
    await GH.saveFile(js);
    toast('Saved & published! Changes go live after GitHub Pages rebuilds (~1 min).');
  } catch (e) {
    toast('Save failed: ' + e.message, 'error');
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = '💾 Save & Publish'; }
  }
}

/* ── Main admin layout ──────────────────────────── */
function renderAdmin() {
  const tabs = [
    { id: 'documents', label: '📚 Documents' },
    { id: 'meta', label: '👤 Personal Info' },
    { id: 'home', label: '🏠 Home Page' },
    { id: 'experience', label: '💼 Experience' },
    { id: 'projects', label: '🚀 Projects' },
    { id: 'skills', label: '🛠 Skills' },
    { id: 'about', label: 'ℹ️ About' },
    { id: 'pages', label: '📑 Custom Pages' },
  ];

  document.getElementById('app').innerHTML = `
    <header class="admin-header">
      <h1>📝 <span>Portfolio</span> Admin</h1>
      <div class="header-actions">
        <div class="status-bar">
          <span class="status-dot"></span>
          <span>${APP.repo}</span>
        </div>
        <button class="btn save-btn btn-success" onclick="saveContent()">💾 Save & Publish</button>
        <button class="btn btn-sm" onclick="previewSite()">👁 Open live site</button>
        <button class="btn btn-sm btn-danger" onclick="disconnect()">Disconnect</button>
      </div>
    </header>
    <div class="admin-body">
      <nav class="admin-sidebar">
        ${tabs.map(t => `<button data-tab="${t.id}" class="${t.id === APP.activeTab ? 'active' : ''}" onclick="switchTab('${t.id}')">${t.label}</button>`).join('')}
      </nav>
      <div class="admin-content ${APP.activeTab === 'documents' ? 'wide' : ''}" id="tabContent"></div>
    </div>`;

  renderTab();
}

function switchTab(id) {
  APP.activeTab = id;
  document.querySelectorAll('.admin-sidebar button').forEach(b => {
    b.classList.toggle('active', b.dataset.tab === id);
  });
  renderTab();
}

function renderTab() {
  const el = document.getElementById('tabContent');
  el.classList.toggle('wide', APP.activeTab === 'documents');
  const renderers = {
    documents: renderDocumentsAdmin,
    meta: renderMeta,
    home: renderHome,
    experience: renderExperience,
    projects: renderProjects,
    skills: renderSkills,
    about: renderAbout,
    pages: renderPages,
  };
  if (renderers[APP.activeTab]) renderers[APP.activeTab](el);
}

function previewSite() {
  // Prefer same-origin site (local server or GitHub Pages)
  const base = window.location.href.split('admin.html')[0];
  let path = '#/';
  if (APP.activeTab === 'documents' && APP.docsSelectedId) {
    path = '#/documents/' + encodeURIComponent(APP.docsSelectedId);
  } else if (APP.activeTab === 'documents') {
    path = '#/documents';
  }
  const url = base + 'index.html' + path + '?v=' + Date.now();
  const w = window.open(url, '_blank');
  if (!w) {
    toast('Pop-up blocked — allow pop-ups, or open index.html manually after Save', 'error');
    return;
  }
  toast('Live site opened. Save & Publish first to see latest edits online.');
}

function disconnect() {
  localStorage.removeItem('gh_token');
  localStorage.removeItem('gh_repo');
  localStorage.removeItem('gh_branch');
  APP.token = ''; APP.repo = ''; APP.data = null;
  renderSetup();
  toast('Disconnected');
}

/* ================================================================
   TAB RENDERERS
   ================================================================ */

function slugifyDoc(s) {
  return String(s || 'doc').toLowerCase().trim()
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/^-|-$/g, '')
    .slice(0, 60) || ('doc-' + Date.now());
}

function uniqueDocId(base) {
  ensureDocsModel();
  let id = slugifyDoc(base);
  const ids = new Set(APP.data.docs.items.map((d) => d.id));
  if (!ids.has(id)) return id;
  let n = 2;
  while (ids.has(id + '-' + n)) n++;
  return id + '-' + n;
}

function mdPreview(src, format) {
  if (format === 'html') return src || '';
  if (typeof marked !== 'undefined' && marked.parse) {
    try { return marked.parse(src || '', { breaks: true, gfm: true }); }
    catch (_) {}
  }
  return '<pre>' + esc(src || '') + '</pre>';
}

/* ── Documents (wiki-style) ───────────────────────── */
function renderDocumentsAdmin(el) {
  ensureDocsModel();
  const folders = APP.data.docs.folders;
  const items = APP.data.docs.items;
  const folderId = APP.docsFolderId;
  const selected = items.find((d) => d.id === APP.docsSelectedId) || null;
  const visible = folderId ? items.filter((d) => d.folderId === folderId) : items;

  el.innerHTML = `
    <div class="section-title" style="margin-bottom:0.75rem">Documents</div>
    <p class="empty-hint" style="padding-top:0;margin-bottom:1rem">
      Write pages in Markdown (or HTML), put them in folders, import files from your computer.
      Use the live preview on the right — then <strong>Save &amp; Publish</strong> to update the site.
    </p>
    <div class="docs-admin">

function selectDocsFolder(id) {
  APP.docsFolderId = id || '';
  renderTab();
}

function selectDocPage(id) {
  APP.docsSelectedId = id;
  renderTab();
}

function addDocsFolder() {
  ensureDocsModel();
  const name = prompt('Folder name');
  if (!name || !name.trim()) return;
  const id = uniqueDocId(name);
  APP.data.docs.folders.push({ id, name: name.trim(), description: '' });
  APP.docsFolderId = id;
  renderTab();
}

function removeDocsFolder(id) {
  ensureDocsModel();
  if (!confirm('Delete this folder? Pages inside become Unfiled.')) return;
  APP.data.docs.folders = APP.data.docs.folders.filter((f) => f.id !== id);
  APP.data.docs.items.forEach((d) => { if (d.folderId === id) d.folderId = ''; });
  if (APP.docsFolderId === id) APP.docsFolderId = '';
  renderTab();
}

function addDocPage() {
  ensureDocsModel();
  const title = prompt('Page title', 'New page');
  if (!title || !title.trim()) return;
  const id = uniqueDocId(title);
  const doc = {
    id,
    title: title.trim(),
    folderId: APP.docsFolderId || '',
    format: 'markdown',
    updated: new Date().toISOString().slice(0, 10),
    published: true,
    body: '# ' + title.trim() + '\n\nStart writing here…\n',
  };
  APP.data.docs.items.unshift(doc);
  APP.docsSelectedId = id;
  renderTab();
}

function removeDocPage(id) {
  ensureDocsModel();
  if (!confirm('Delete this page?')) return;
  APP.data.docs.items = APP.data.docs.items.filter((d) => d.id !== id);
  if (APP.docsSelectedId === id) APP.docsSelectedId = '';
  renderTab();
}

function getSelectedDoc() {
  ensureDocsModel();
  return APP.data.docs.items.find((d) => d.id === APP.docsSelectedId) || null;
}

function updateSelectedDoc(key, value) {
  const doc = getSelectedDoc();
  if (!doc) return;
  doc[key] = value;
  doc.updated = new Date().toISOString().slice(0, 10);
  if (key === 'folderId' || key === 'published' || key === 'format') {
    renderTab();
    return;
  }
  if (key === 'title') {
    const listBtn = document.querySelector('.doc-item.active');
    if (listBtn) listBtn.textContent = value || 'Untitled';
  }
}

function onDocBodyInput(value) {
  const doc = getSelectedDoc();
  if (!doc) return;
  doc.body = value;
  doc.updated = new Date().toISOString().slice(0, 10);
  refreshDocPreview();
}

function refreshDocPreview() {
  const doc = getSelectedDoc();
  const el = document.getElementById('docLivePreview');
  if (!doc || !el) return;
  el.innerHTML = mdPreview(doc.body || '', doc.format);
}

function renameDocId(next) {
  const doc = getSelectedDoc();
  if (!doc) return;
  const id = slugifyDoc(next);
  if (!id || id === doc.id) return;
  if (APP.data.docs.items.some((d) => d.id === id)) {
    toast('That page id already exists', 'error');
    renderTab();
    return;
  }
  doc.id = id;
  APP.docsSelectedId = id;
  renderTab();
}

async function importDocFile(ev) {
  const file = ev.target.files && ev.target.files[0];
  ev.target.value = '';
  if (!file) return;
  ensureDocsModel();
  const text = await file.text();
  const name = file.name.replace(/\.(md|markdown|txt|html?|csv|json)$/i, '');
  const lower = file.name.toLowerCase();
  const format = (lower.endsWith('.html') || lower.endsWith('.htm')) ? 'html' : 'markdown';
  const id = uniqueDocId(name);
  const body = format === 'html' ? text : text;
  APP.data.docs.items.unshift({
    id,
    title: name || 'Imported page',
    folderId: APP.docsFolderId || '',
    format,
    updated: new Date().toISOString().slice(0, 10),
    published: true,
    body,
  });
  APP.docsSelectedId = id;
  toast('Imported “' + file.name + '” — review preview, then Save & Publish');
  renderTab();
}

/** Parse YYYY-MM or YYYY-MM-DD */
function parseRoleDate(str) {
  if (!str) return null;
  const m = String(str).trim().match(/^(\d{4})-(\d{2})(?:-(\d{2}))?$/);
  if (!m) return null;
  const dt = new Date(+m[1], +m[2] - 1, m[3] ? +m[3] : 1);
  return isNaN(dt.getTime()) ? null : dt;
}

function exactDateLabel(str) {
  const dt = parseRoleDate(str);
  if (!dt) return '';
  return dt.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
}

/** Display line + exact range — mirrors site U.duration / U.exactRange */
function formatDurationPreview(startStr, endStr) {
  const start = parseRoleDate(startStr);
  if (!start) return '';
  const end = endStr ? parseRoleDate(endStr) : new Date();
  if (!end) return '';
  let months = (end.getFullYear() - start.getFullYear()) * 12
    + (end.getMonth() - start.getMonth()) + 1;
  if (months < 1) months = 1;
  const y = Math.floor(months / 12);
  const m = months % 12;
  const sLabel = start.toLocaleDateString('en-US', { month: 'short', year: 'numeric' });
  const eLabel = endStr
    ? end.toLocaleDateString('en-US', { month: 'short', year: 'numeric' })
    : 'Present';
  let dur = '';
  if (y > 0) dur += y + ' yr' + (y > 1 ? 's' : '');
  if (m > 0) dur += (dur ? ' ' : '') + m + ' mo' + (m !== 1 ? 's' : '');
  if (!dur) dur = '1 mo';
  const display = sLabel + ' – ' + eLabel + ' · ' + dur;
  const exact = exactDateLabel(startStr) + ' – ' + (endStr ? exactDateLabel(endStr) : 'Present');
  return 'Display: ' + display + '  |  Exact: ' + exact;
}

function updateDurationPreview(ji, ri) {
  const role = APP.data.experience[ji].roles[ri];
  const el = document.getElementById('dur-' + ji + '-' + ri);
  if (el) el.textContent = formatDurationPreview(role.start, role.end) || 'Computed: — set start date';
}

        <span style="font-size:0.72rem;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;color:var(--accent);padding:0.15rem 0.45rem;border:1px solid var(--border);border-radius:4px">${esc(sec.type || 'unknown')}</span>
        <div style="display:flex;gap:0.3rem">
          ${si > 0 ? `<button class="btn btn-sm" onclick="moveDetailSection(${pi},${si},-1)">↑</button>` : ''}
          ${si < sections.length - 1 ? `<button class="btn btn-sm" onclick="moveDetailSection(${pi},${si},1)">↓</button>` : ''}
          <button class="btn btn-sm btn-danger" onclick="removeDetailSection(${pi},${si})">✕</button>
        </div>
      </div>
      <div class="field" style="margin-bottom:0.65rem">
        <label>Section title</label>
        <input type="text" value="${esc(sec.title || '')}" onchange="APP.data.projects[${pi}].detail.sections[${si}].title=this.value">
      </div>
      ${renderSectionFields(pi, si, sec)}
    </div>`).join('');
}

function renderSectionFields(pi, si, sec) {
  const type = sec.type || 'text';
  if (type === 'text') {
    return `<div class="field" style="margin-bottom:0">
      <label>Paragraphs (blank line between)</label>
      <textarea rows="4" onchange="setTextContent(${pi},${si},this.value)">${esc((sec.content || []).join('\n\n'))}</textarea>
    </div>`;
  }
  if (type === 'features') {
    return `<div class="field" style="margin-bottom:0">
      <label>Features (one per line)</label>
      <textarea rows="5" onchange="APP.data.projects[${pi}].detail.sections[${si}].items=this.value.split('\\n').map(l=>l.trim()).filter(Boolean)">${esc((sec.items || []).join('\n'))}</textarea>
    </div>`;
  }
  if (type === 'metrics') {
    const rows = (sec.items || []).map((it, mi) => `
      <div class="list-item" style="margin-bottom:0.35rem">
        <input type="text" value="${esc(it.value)}" placeholder="Value" style="max-width:120px"
          onchange="APP.data.projects[${pi}].detail.sections[${si}].items[${mi}].value=this.value">
        <input type="text" value="${esc(it.label)}" placeholder="Label"
          onchange="APP.data.projects[${pi}].detail.sections[${si}].items[${mi}].label=this.value">
        <button class="btn btn-sm btn-danger" onclick="removeMetricItem(${pi},${si},${mi})">✕</button>
      </div>`).join('') || '<div class="hint">No metrics yet.</div>';
    return rows + `<button class="btn btn-sm" style="margin-top:0.35rem" onclick="addMetricItem(${pi},${si})">+ Metric</button>`;
  }
  if (type === 'tech') {
    return `<div class="field" style="margin-bottom:0">
      <label>Tech names (comma-separated — existing icons kept when name matches)</label>
      <input type="text" value="${esc((sec.items || []).map(t => t.name || t).join(', '))}"
        onchange="setTechItems(${pi},${si},this.value)">
    </div>`;
  }
  if (type === 'timeline') {
    const rows = (sec.steps || []).map((st, sti) => `
      <div style="margin-bottom:0.5rem;padding:0.5rem;border:1px solid var(--border);border-radius:6px">
        <div class="row" style="margin-bottom:0.35rem">
          <div class="field" style="margin-bottom:0">
            <label>Step title</label>
            <input type="text" value="${esc(st.title || '')}"
              onchange="APP.data.projects[${pi}].detail.sections[${si}].steps[${sti}].title=this.value">
          </div>
          <div style="display:flex;align-items:flex-end;padding-bottom:0.1rem">
            <button class="btn btn-sm btn-danger" onclick="removeTimelineStep(${pi},${si},${sti})">✕</button>
          </div>
        </div>
        <div class="field" style="margin-bottom:0">
          <label>Description</label>
          <input type="text" value="${esc(st.desc || '')}"
            onchange="APP.data.projects[${pi}].detail.sections[${si}].steps[${sti}].desc=this.value">
        </div>
      </div>`).join('') || '<div class="hint">No steps yet.</div>';
    return rows + `<button class="btn btn-sm" style="margin-top:0.35rem" onclick="addTimelineStep(${pi},${si})">+ Step</button>`;
  }
  if (type === 'chart') {
    return `<div class="row">
      <div class="field" style="margin-bottom:0">
        <label>Chart type</label>
        <select onchange="APP.data.projects[${pi}].detail.sections[${si}].chartType=this.value">
          ${['line','bar','doughnut','radar','pie'].map(t => `<option value="${t}" ${sec.chartType === t ? 'selected' : ''}>${t}</option>`).join('')}
        </select>
      </div>
      <div class="field" style="margin-bottom:0">
        <label>CSV path</label>
        <input type="text" value="${esc(sec.csvFile || '')}" placeholder="data/file.csv"
          onchange="APP.data.projects[${pi}].detail.sections[${si}].csvFile=this.value">
      </div>
    </div>
    <div class="hint" style="margin-top:0.35rem">Upload CSVs under data/. Col 1 = labels, remaining cols = series.</div>`;
  }
  if (type === 'table') {
    return `<div class="field" style="margin-bottom:0">
      <label>CSV path</label>
      <input type="text" value="${esc(sec.csvFile || '')}" placeholder="data/file.csv"
        onchange="APP.data.projects[${pi}].detail.sections[${si}].csvFile=this.value">
      <div class="hint" style="margin-top:0.25rem">
        <label style="display:inline-flex;align-items:center;gap:0.35rem;text-transform:none;letter-spacing:0;font-weight:500">
          <input type="checkbox" ${sec.filterable ? 'checked' : ''}
            onchange="APP.data.projects[${pi}].detail.sections[${si}].filterable=this.checked"> Filterable table
        </label>
      </div>
    </div>`;
  }
  if (type === 'files') {
    const items = sec.items || [];
    const rows = items.map((f, fi) => `
      <div class="list-item" style="margin-bottom:0.35rem">
        <input type="text" value="${esc(f.name || '')}" placeholder="filename.py" style="max-width:160px"
          onchange="APP.data.projects[${pi}].detail.sections[${si}].items[${fi}].name=this.value">
        <input type="text" value="${esc(f.path || f.url || '')}" placeholder="files/... or URL"
          onchange="APP.data.projects[${pi}].detail.sections[${si}].items[${fi}].path=this.value">
        <input type="text" value="${esc(f.description || '')}" placeholder="Description" style="max-width:180px"
          onchange="APP.data.projects[${pi}].detail.sections[${si}].items[${fi}].description=this.value">
        <button class="btn btn-sm btn-danger" onclick="removeFileItem(${pi},${si},${fi})">✕</button>
      </div>`).join('') || '<div class="hint">No files yet.</div>';
    return rows + `<button class="btn btn-sm" style="margin-top:0.35rem" onclick="addFileItem(${pi},${si})">+ File</button>`;
  }
  // Fallback for architecture / code / gallery / unknown
  return `<div class="hint">Type <code>${esc(type)}</code> — edit title above. Complex fields: edit src/data.js or convert to text.</div>`;
}

function setTextContent(pi, si, raw) {
  const parts = raw.split(/\n\s*\n/).map(p => p.trim()).filter(Boolean);
  APP.data.projects[pi].detail.sections[si].content = parts.length ? parts : (raw.trim() ? [raw.trim()] : []);
}

function setTechItems(pi, si, raw) {
  const names = raw.split(',').map(s => s.trim()).filter(Boolean);
  const prev = APP.data.projects[pi].detail.sections[si].items || [];
  APP.data.projects[pi].detail.sections[si].items = names.map(name => {
    const old = prev.find(t => (t.name || t) === name);
    return old && typeof old === 'object' ? { ...old, name } : { name };
  });
}

function addDetailSection(pi, type) {
  ensureDetail(pi);
  const templates = {
    text: { type: 'text', title: 'Overview', content: [''] },
    metrics: { type: 'metrics', title: 'Impact', items: [{ value: '', label: '' }] },
    features: { type: 'features', title: 'Key Capabilities', items: [''] },
    tech: { type: 'tech', title: 'Tech Stack', items: [{ name: 'Python' }] },
    timeline: { type: 'timeline', title: 'How It Works', steps: [{ title: '', desc: '' }] },
    chart: { type: 'chart', title: 'New Chart', chartType: 'line', csvFile: 'data/' },
    table: { type: 'table', title: 'Data Table', filterable: true, csvFile: 'data/' },
    files: { type: 'files', title: 'Source Files & Notebooks', items: [] },
  };
  APP.data.projects[pi].detail.sections.push(templates[type] || templates.text);
  renderTab();
}

function removeDetailSection(pi, si) {
  if (!confirm('Remove this section?')) return;
  APP.data.projects[pi].detail.sections.splice(si, 1);
  renderTab();
}

function moveDetailSection(pi, si, dir) {
  const arr = APP.data.projects[pi].detail.sections;
  const j = si + dir;
  if (j < 0 || j >= arr.length) return;
  [arr[si], arr[j]] = [arr[j], arr[si]];
  renderTab();
}

function addMetricItem(pi, si) {
  const sec = APP.data.projects[pi].detail.sections[si];
  if (!sec.items) sec.items = [];
  sec.items.push({ value: '', label: '' });
  renderTab();
}
function removeMetricItem(pi, si, mi) {
  APP.data.projects[pi].detail.sections[si].items.splice(mi, 1);
  renderTab();
}
function addTimelineStep(pi, si) {
  const sec = APP.data.projects[pi].detail.sections[si];
  if (!sec.steps) sec.steps = [];
  sec.steps.push({ title: '', desc: '' });
  renderTab();
}
function removeTimelineStep(pi, si, sti) {
  APP.data.projects[pi].detail.sections[si].steps.splice(sti, 1);
  renderTab();
}
function addFileItem(pi, si) {
  const sec = APP.data.projects[pi].detail.sections[si];
  if (!sec.items) sec.items = [];
  sec.items.push({ name: '', path: '', description: '' });
  renderTab();
}
function removeFileItem(pi, si, fi) {
  APP.data.projects[pi].detail.sections[si].items.splice(fi, 1);
  renderTab();
}

          ${(s.items || []).map((it, ii) => `
            <div class="list-item">
              <input type="text" value="${esc(it)}" placeholder="Feature" onchange="APP.data.customPages['${pid}'].sections[${si}].items[${ii}]=this.value">
              <button class="btn btn-sm btn-danger" onclick="removePageSectionItem('${pid}',${si},${ii})">✕</button>
            </div>`).join('')}
          <button class="btn btn-sm" style="margin-top:0.5rem" onclick="addPageSectionItem('${pid}',${si},'features')">+ Add Feature</button>`;
        break;
      case 'tech':
        body = `
          <div class="field"><label>Title</label><input type="text" value="${esc(s.title || '')}" onchange="APP.data.customPages['${pid}'].sections[${si}].title=this.value"></div>
          ${(s.items || []).map((it, ii) => `
            <div class="list-item">
              <input type="text" value="${esc(it.name)}" placeholder="Name" onchange="APP.data.customPages['${pid}'].sections[${si}].items[${ii}].name=this.value">
              <input type="text" value="${esc(it.icon)}" placeholder="Icon URL or key" style="max-width:300px" onchange="APP.data.customPages['${pid}'].sections[${si}].items[${ii}].icon=this.value">
              <button class="btn btn-sm btn-danger" onclick="removePageSectionItem('${pid}',${si},${ii})">✕</button>
            </div>`).join('')}
          <button class="btn btn-sm" style="margin-top:0.5rem" onclick="addPageSectionItem('${pid}',${si},'tech')">+ Add Tech</button>
          <div class="hint">Icon: URL (https://cdn.simpleicons.org/SLUG) or key (brain, bot, etc.)</div>`;
        break;
      case 'timeline':
        body = `
          <div class="field"><label>Title</label><input type="text" value="${esc(s.title || '')}" onchange="APP.data.customPages['${pid}'].sections[${si}].title=this.value"></div>
          ${(s.steps || []).map((st, ii) => `
            <div class="list-item" style="flex-direction:column;align-items:stretch;gap:0.5rem">
              <div style="display:flex;gap:0.5rem">
                <input type="text" value="${esc(st.title)}" placeholder="Step title" onchange="APP.data.customPages['${pid}'].sections[${si}].steps[${ii}].title=this.value">
                <button class="btn btn-sm btn-danger" onclick="removePageSectionStep('${pid}',${si},${ii})">✕</button>
              </div>
              <input type="text" value="${esc(st.desc || '')}" placeholder="Description" onchange="APP.data.customPages['${pid}'].sections[${si}].steps[${ii}].desc=this.value">
            </div>`).join('')}
          <button class="btn btn-sm" style="margin-top:0.5rem" onclick="addPageSectionStep('${pid}',${si})">+ Add Step</button>`;
        break;
      case 'cards':
        body = `
          <div class="field"><label>Title</label><input type="text" value="${esc(s.title || '')}" onchange="APP.data.customPages['${pid}'].sections[${si}].title=this.value"></div>
          ${(s.items || []).map((it, ii) => `
            <div style="background:var(--bg);padding:0.75rem;border-radius:var(--radius);margin-bottom:0.5rem">
              <div style="display:flex;justify-content:space-between;margin-bottom:0.5rem">
                <strong style="font-size:0.82rem">${esc(it.title) || 'Card'}</strong>
                <button class="btn btn-sm btn-danger" onclick="removePageSectionItem('${pid}',${si},${ii})">✕</button>
              </div>
              <div class="row-3">
                <div class="field"><label>Title</label><input type="text" value="${esc(it.title)}" onchange="APP.data.customPages['${pid}'].sections[${si}].items[${ii}].title=this.value"></div>
                <div class="field"><label>Subtitle</label><input type="text" value="${esc(it.subtitle || '')}" onchange="APP.data.customPages['${pid}'].sections[${si}].items[${ii}].subtitle=this.value"></div>
                <div class="field"><label>Icon key</label><input type="text" value="${esc(it.icon || '')}" onchange="APP.data.customPages['${pid}'].sections[${si}].items[${ii}].icon=this.value"></div>
              </div>
              <div class="field"><label>Description</label><input type="text" value="${esc(it.description || '')}" onchange="APP.data.customPages['${pid}'].sections[${si}].items[${ii}].description=this.value"></div>
            </div>`).join('')}
          <button class="btn btn-sm" style="margin-top:0.5rem" onclick="addPageSectionItem('${pid}',${si},'cards')">+ Add Card</button>`;
        break;
      case 'links':
        body = `
          <div class="field"><label>Title</label><input type="text" value="${esc(s.title || '')}" onchange="APP.data.customPages['${pid}'].sections[${si}].title=this.value"></div>
          ${(s.items || []).map((it, ii) => `
            <div class="list-item">
              <input type="text" value="${esc(it.label)}" placeholder="Label" onchange="APP.data.customPages['${pid}'].sections[${si}].items[${ii}].label=this.value">
              <input type="text" value="${esc(it.url)}" placeholder="URL" onchange="APP.data.customPages['${pid}'].sections[${si}].items[${ii}].url=this.value">
              <input type="text" value="${esc(it.description || '')}" placeholder="Description" style="max-width:200px" onchange="APP.data.customPages['${pid}'].sections[${si}].items[${ii}].description=this.value">
              <button class="btn btn-sm btn-danger" onclick="removePageSectionItem('${pid}',${si},${ii})">✕</button>
            </div>`).join('')}
          <button class="btn btn-sm" style="margin-top:0.5rem" onclick="addPageSectionItem('${pid}',${si},'links')">+ Add Link</button>`;
        break;
    }
    return `
      <div style="background:var(--bg);padding:1rem;border-radius:var(--radius);margin-bottom:0.75rem">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.75rem">
          <span style="font-size:0.8rem;font-weight:600;color:var(--accent);text-transform:uppercase">${s.type}</span>
          <div style="display:flex;gap:0.25rem">
            ${si > 0 ? `<button class="btn btn-sm" onclick="movePageSection('${pid}',${si},-1)">↑</button>` : ''}
            ${si < sections.length - 1 ? `<button class="btn btn-sm" onclick="movePageSection('${pid}',${si},1)">↓</button>` : ''}
            <button class="btn btn-sm btn-danger" onclick="removePageSection('${pid}',${si})">✕</button>
          </div>
        </div>
        ${body}
      </div>`;
  }).join('');
}

/* Custom page helpers */
function addCustomPage() {
  const id = 'page-' + Date.now().toString(36);
  if (!APP.data.customPages) APP.data.customPages = {};
  APP.data.customPages[id] = { title: 'New Page', subtitle: '', sections: [] };
  // Add to nav
  APP.data.pages.push({ id: id, label: 'New Page', icon: 'fileText' });
  renderTab();
}

function removeCustomPage(pid) {
  if (!confirm('Remove this page and all its sections?')) return;
  delete APP.data.customPages[pid];
  APP.data.pages = APP.data.pages.filter(p => p.id !== pid);
  renderTab();
}

function renameCustomPage(oldId, newId) {
  newId = newId.trim().toLowerCase().replace(/[^a-z0-9-]/g, '-').replace(/-+/g, '-');
  if (!newId || newId === oldId) return;
  const builtIn = ['home','experience','projects','skills','about'];
  if (builtIn.includes(newId) || (APP.data.customPages[newId] && newId !== oldId)) {
    toast('That page ID is already taken', 'error'); return;
  }
  APP.data.customPages[newId] = APP.data.customPages[oldId];
  delete APP.data.customPages[oldId];
  const pg = APP.data.pages.find(p => p.id === oldId);
  if (pg) pg.id = newId;
  renderTab();
}

function syncPageLabel(pid, label) {
  const pg = APP.data.pages.find(p => p.id === pid);
  if (pg) pg.label = label;
}

function getPageIcon(pid) {
  const pg = APP.data.pages.find(p => p.id === pid);
  return pg ? pg.icon : 'fileText';
}

function updatePageIcon(pid, icon) {
  const pg = APP.data.pages.find(p => p.id === pid);
  if (pg) pg.icon = icon;
}

function movePageInNav(pid, newIdx) {
  const oldIdx = APP.data.pages.findIndex(p => p.id === pid);
  if (oldIdx === newIdx || oldIdx < 0) return;
  const [item] = APP.data.pages.splice(oldIdx, 1);
  APP.data.pages.splice(newIdx, 0, item);
  renderTab();
}

function addPageSection(pid, type) {
  const sec = { type: type, title: '' };
  if (type === 'text') sec.content = [''];
  else if (type === 'metrics') sec.items = [{ value: '', label: '' }];
  else if (type === 'features') sec.items = [''];
  else if (type === 'tech') sec.items = [{ name: '', icon: '' }];
  else if (type === 'timeline') sec.steps = [{ title: '', desc: '' }];
  else if (type === 'cards') sec.items = [{ title: '', subtitle: '', icon: '', description: '' }];
  else if (type === 'links') sec.items = [{ label: '', url: '', description: '' }];
  APP.data.customPages[pid].sections.push(sec);
  renderTab();
}

function removePageSection(pid, si) {
  APP.data.customPages[pid].sections.splice(si, 1);
  renderTab();
}

function movePageSection(pid, si, dir) {
  const arr = APP.data.customPages[pid].sections;
  [arr[si], arr[si + dir]] = [arr[si + dir], arr[si]];
  renderTab();
}

function addPageSectionItem(pid, si, type) {
  const sec = APP.data.customPages[pid].sections[si];
  if (type === 'metrics') sec.items.push({ value: '', label: '' });
  else if (type === 'features') sec.items.push('');
  else if (type === 'tech') sec.items.push({ name: '', icon: '' });
  else if (type === 'cards') sec.items.push({ title: '', subtitle: '', icon: '', description: '' });
  else if (type === 'links') sec.items.push({ label: '', url: '', description: '' });
  renderTab();
}

function removePageSectionItem(pid, si, ii) {
  APP.data.customPages[pid].sections[si].items.splice(ii, 1);
  renderTab();
}

function addPageSectionStep(pid, si) {
  APP.data.customPages[pid].sections[si].steps.push({ title: '', desc: '' });
  renderTab();
}

function removePageSectionStep(pid, si, ii) {
  APP.data.customPages[pid].sections[si].steps.splice(ii, 1);
  renderTab();
}

/* ── Util ─────────────────────────────────────────── */
function esc(str) {
  if (str == null) return '';
  return String(str).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

/* ── Init ─────────────────────────────────────────── */
(async function init() {
  if (APP.token && APP.repo) {
    try {
      document.getElementById('app').innerHTML = '<div class="setup-box"><span class="spinner"></span><p style="margin-top:1rem">Loading content...</p></div>';
      await loadContent();
      toast('Content loaded');
    } catch (e) {
      toast('Failed to load: ' + e.message, 'error');
      renderSetup();
    }
  } else {
    renderSetup();
  }
})();
</script>
